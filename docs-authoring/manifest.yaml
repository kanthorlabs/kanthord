# ── Open questions ────────────────────────────────────────────────────────────
open-questions:
  - id: OQ1
    text: >
      The root repository submodule pointer (c4b5256) lags the checked-out
      engine (c17e718). Which commit is authoritative for publication, and
      should the pointer be bumped before the next documentation session
      publishes pages?
    affects: [overview.md, all pages]
    resolution: null

  - id: OQ2
    text: >
      docs/ is served from a public repository. The engine repository is
      private. Citation links resolve only for readers with private-repo
      access. Is publishing engine internals — including a named code defect
      (C15) and the external-execution trust model (C16) — acceptable on a
      public site? Must any citation be redacted or summarised?
    affects: [all pages]
    resolution: null

  - id: OQ3
    text: >
      src/main.ts around line 270 hardcodes callerRecord as
      { worker: "claude@1", authorized: ["claude@1"] } for every request.
      This is recorded as claim C15 and as a current limitation. Confirm
      that this is a defect to fix, not intentional behaviour, before
      capability-status.md characterises it.
    affects: [capability-status.md, who-does-work.md, identity-access.md]
    resolution: null

  - id: OQ4
    text: >
      Epic files are not a reliable status source: all 29 files in the
      050-057 range declare Status: draft, including epics 050, 050.1 and
      050.2 which engine/scripts/epic-sequence-range.ts records as shipped.
      Additionally 050.3 shipped without being appended to shippedEpics.
      A future session must not trust either source alone when authoring
      capability-status.md.
    affects: [capability-status.md]
    resolution: null

  - id: OQ5
    text: >
      Epics 053.1 and 050.1 name different owners for the same judged_oid
      pin. The epic text states a reader cannot tell which the code follows.
      This is a conflicting design qualification. Resolve which owner the
      code follows before authoring state-completion.md and
      capability-status.md.
    affects: [state-completion.md, capability-status.md]
    resolution: null

# ── Session protocol ──────────────────────────────────────────────────────────
session-protocol:
  - Run scripts/docs/check.sh and fix every reported citation error before
    reading anything else.
  - Read this manifest. Note the open-questions and the drift between
    engine-pinned and engine-pointer.
  - Pick the highest fact-readiness destination or work-unit that has status
    stub or in-progress. Break ties by the documentation-map order in
    docs/overview.md (system-map, identity-access, setup-registration,
    work-graph, who-does-work, state-completion, recovery, capability-status,
    reference).
  - Re-verify only that destination's source citations against the current
    submodule pointer (from git rev-parse HEAD:engine); do not re-verify the
    whole manifest.
  - Write the page. Keep to the legend.md conventions throughout.
  - Check that the page renders in docs/viewer.html before committing.
  - Update this manifest: set the destination's status to written, set
    verified-at to the seven-character prefix of git rev-parse HEAD:engine
    (the parent-recorded pointer, not the engine working-tree HEAD), and mark
    each covered inventory item as documented.
  - Commit the page and this manifest in one commit. Never split them.
  - If the page is left unfinished, commit docs-authoring/<destination>.notes.md
    with evidence reasoning and diagram drafts. Leave the published stub.
    Never commit a half-written page to docs/.

amendment-rule: >
  If a session finds an overview claim false, it corrects docs/overview.md
  and sets that claim's status in this manifest to amended:<commit> in the
  same commit as the contradicting page. A page that contradicts a claim
  must never be committed without amending overview.md in the same commit.
