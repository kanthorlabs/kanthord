# docs-authoring/manifest.yaml
#
# Cross-session spine for the kanthord documentation build.
# This file is an index that routes a future session to content.
# It does not store claim text — claim text lives once, in docs/overview.md.
# This file lives outside docs/ because docs/ is served verbatim to the public.

# ── Anchors ───────────────────────────────────────────────────────────────────
anchors:
  engine-pinned: c17e718
  engine-pointer: c4b5256
  drift-note: >
    engine-pointer (c4b5256) is the commit the root repository's submodule
    pointer records in git. engine-pinned (c17e718) is the commit every current
    page was verified against; the engine working tree is checked out at
    c17e718. These differ. The submodule pointer is authoritative for
    publication: obtain it with git rev-parse HEAD:engine, which reads the
    parent-recorded gitlink. git submodule status reports the checked-out
    commit instead, and the two disagree exactly when this drift exists.
    A future session must reconcile the two before publishing new pages.

