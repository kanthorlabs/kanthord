limit_req_zone $binary_remote_addr zone=homelab_kanthord:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=homelab_kanthord_conn:10m;

server {
    listen 127.0.0.1:80;
    server_name @HOST@;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    location = /s/kanthord {
        return 301 /s/kanthord/;
    }

    location ^~ /s/kanthord/ {
        limit_req zone=homelab_kanthord burst=40 nodelay;
        limit_conn homelab_kanthord_conn 20;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 50m;

        proxy_pass http://127.0.0.1:@HOMELAB_PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
