<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="480" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kanthord-containers-title kanthord-containers-desc">
      <title id="kanthord-containers-title">kanthord container diagram</title>
      <desc id="kanthord-containers-desc">A human and an external harness reach kanthord through the CLI or directly through the daemon API; the daemon performs repository actions on a git platform and uses a large language model provider, and the harness invokes a repository action through the daemon.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="48" y="64" width="192" height="252" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="56" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="86" y="68" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ACTORS</text>

      <rect x="400" y="64" width="192" height="252" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="412" y="56" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="446" y="68" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KANTHORD</text>

      <rect x="728" y="64" width="192" height="252" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="740" y="56" width="92" height="16" rx="2" fill="#f5f5f5"/>
      <text x="786" y="68" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL SYSTEMS</text>

      <!-- arrows -->
      <path d="M 224,112 H 416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 224,144 H 304 Q 312,144 312,152 V 240 Q 312,248 320,248 H 416" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 184,232 V 200 Q 184,192 192,192 H 304 a 8,8 0 0,1 16,0 H 432 Q 440,192 440,184 V 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 224,272 H 416" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 500,160 V 232" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 576,284 H 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 576,260 H 648 Q 656,260 656,252 V 136 Q 656,128 664,128 H 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- arrow labels -->
      <rect x="288" y="88" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="320" y="100" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANAGES</text>

      <rect x="336" y="168" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="366" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACCESSES</text>

      <rect x="620" y="292" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="660" y="304" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPO ACTIONS</text>

      <rect x="664" y="184" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="690" y="196" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODELS</text>

      <!-- node: Human -->
      <rect x="64" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="96" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="76" y="104" width="44" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="98" y="116" fill="rgba(122,131,153,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSON</text>
      <text x="144" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human</text>

      <!-- node: External harness -->
      <rect x="64" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="232" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="76" y="240" width="56" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="104" y="252" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="144" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External harness</text>

      <!-- node: CLI -->
      <rect x="416" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="428" y="104" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="450" y="116" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="496" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI</text>

      <!-- node: Daemon (focal) -->
      <rect x="416" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="232" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="240" width="52" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="454" y="252" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROCESS</text>
      <text x="496" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Daemon</text>
      <text x="496" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 services</text>

      <!-- node: Large language model provider -->
      <rect x="744" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="96" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="756" y="104" width="56" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="784" y="116" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="824" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Large language model</text>
      <text x="824" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">provider</text>

      <!-- node: Git platform -->
      <rect x="744" y="232" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="232" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="756" y="240" width="56" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="784" y="252" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="824" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git platform</text>

      <!-- legend -->
      <line x1="40" y1="412" x2="920" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="420" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="136" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Actor</text>

      <rect x="248" y="420" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="272" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Client</text>

      <rect x="384" y="420" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="408" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Daemon</text>

      <rect x="520" y="420" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="544" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">External system</text>

      <line x1="656" y1="428" x2="672" y2="428" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="680" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Relation</text>

      <line x1="792" y1="428" x2="808" y2="428" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="816" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">API call</text>
    </svg>
