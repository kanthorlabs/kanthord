      <text x="760" y="484" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
      <text x="304" y="564" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFUSAL</text>

      <rect x="40" y="64" width="224" height="72" rx="6" fill="#f5f5f5"/>
