<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="project-service-authorization-title project-service-authorization-desc">
      <title id="project-service-authorization-title">Project Service authorization of one operation</title>
      <desc id="project-service-authorization-desc">A requester, which is a run or an external harness, presents its identity and requests an operation. The protected facility resolves that identity to the project and to the level, then checks the binding of that project for the requested operation. When the binding permits the operation, the facility consults custody for the secret material and performs the authenticated operation against the remote. When the binding does not permit the operation, the facility refuses and never consults custody. The facility and custody sit inside the Project Service, and one resolution authorizes one operation.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

