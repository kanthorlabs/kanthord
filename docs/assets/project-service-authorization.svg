      <text x="888" y="356" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">EVERY OPERATION RESOLVES AGAIN.</text>

      <text x="148" y="372" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[the binding permits]</text>
      <text x="148" y="540" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[the binding does not permit]</text>

      <text x="608" y="388" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSULT</text>
      <text x="608" y="420" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SECRET</text>
      <rect x="716" y="440" width="88" height="16" rx="2" fill="#ededee"/>
      <text x="760" y="452" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPERATION</text>
