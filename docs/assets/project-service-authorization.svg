<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="1590" viewBox="0 0 900 1590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="project-service-authorization-title project-service-authorization-desc">
  <title id="project-service-authorization-title">Project Service authorization and delivery-source verification</title>
  <desc id="project-service-authorization-desc">For an authenticated external operation, an execution presents its execution identity. An external harness presents its client identity and, for an execution operation, the execution identity of its claim. The Scheduler observer presents a service identity. Inside the daemon, the Project Service protected facility resolves an execution or client identity to the project and node, reading execution claim state from Scheduler for an execution operation. An execution identity resolves to the node of its claim; the facility refuses an operation that names another node. It resolves a service identity through the external object to the repository binding, project and node, and permits that identity only the read of an external object. It checks the current project binding before consulting custody. Refusal never reaches custody. If permitted, it consults custody and performs one authenticated operation against the remote; no credential leaves the daemon. The execution operation record names the execution identity, and the observation record names the service identity. Each operation resolves the binding again. Separately, delivery-source verification is the Project Service's own operation against the source binding of its project. The verification secret is held behind custody. Verification names no requester identity, acts on nothing external, and records the source binding.</desc>
  <defs>
    <style>
      text { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2d3142; }
      .auth-title { font-size: 24px; font-weight: 600; }
      .auth-name { font-size: 18px; font-weight: 600; }
      .auth-label { font-size: 15px; fill: #4f5d75; }
      .auth-tag { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; fill: #4f5d75; letter-spacing: 0.04em; }
      .auth-node { fill: #ffffff; stroke: #4f5d75; stroke-width: 1.2; }
      .auth-actor { fill: #e9ebee; stroke: #7a8399; stroke-width: 1.2; }
      .auth-facility { fill: #fff0e9; stroke: #eb6c36; stroke-width: 1.2; }
      .auth-custody { fill: #e9ebee; stroke: #4f5d75; stroke-width: 1.2; }
      .auth-edge { fill: none; stroke: #4f5d75; stroke-width: 1.5; marker-end: url(#auth-arrow); }
      .auth-api { fill: none; stroke: #2e5aa8; stroke-width: 1.5; marker-end: url(#auth-arrow-api); }
      .auth-operation { fill: none; stroke: #eb6c36; stroke-width: 1.5; marker-end: url(#auth-arrow-operation); }
      .auth-return { fill: none; stroke: #4f5d75; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#auth-arrow); }
      .auth-rule { stroke: #d8dbe1; stroke-width: 1; }
    </style>
    <marker id="auth-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
    <marker id="auth-arrow-api" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker>
    <marker id="auth-arrow-operation" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#eb6c36"/></marker>
  </defs>

  <rect width="900" height="1590" fill="#f5f5f5"/>
  <text x="32" y="42" class="auth-title">Project Service · authorization</text>
  <text x="32" y="70" class="auth-label">One authenticated operation per resolution. Resolve the current binding again for the next.</text>

  <!-- The protected facility and custody are inside the Project Service. -->
  <rect x="32" y="320" width="836" height="656" rx="10" fill="#efeff1" stroke="#c9cdd5" stroke-width="1.2"/>
  <text x="190" y="349" class="auth-tag">PROJECT SERVICE · IN DAEMON</text>
  <text x="190" y="367" class="auth-label">Protected facility</text>

  <!-- The three requester identities have distinct resolution paths. -->
  <g id="auth-execution-requester">
    <rect x="32" y="110" width="262" height="162" rx="6" class="auth-actor"/>
    <text x="48" y="135" class="auth-tag">REQUESTER</text>
    <text x="48" y="164" class="auth-name">Execution</text>
    <text x="48" y="194" class="auth-label">Execution identity</text>
    <text x="48" y="244" class="auth-label">Requests an operation</text>
    <path d="M163 272 V374" class="auth-edge"/>
  </g>
  <g id="auth-harness-requester">
    <rect x="319" y="110" width="262" height="162" rx="6" class="auth-actor"/>
    <text x="335" y="135" class="auth-tag">REQUESTER · API OR CLI</text>
    <text x="335" y="164" class="auth-name">External harness</text>
    <text x="335" y="194" class="auth-label">Client identity</text>
    <text x="335" y="216" class="auth-label">+ claim's execution identity</text>
    <text x="335" y="238" class="auth-label">for an execution operation</text>
    <path d="M450 272 V374" class="auth-api"/>
  </g>
  <g id="auth-service-requester">
    <rect x="606" y="110" width="262" height="162" rx="6" class="auth-actor"/>
    <text x="622" y="135" class="auth-tag">SCHEDULER SERVICE</text>
    <text x="622" y="164" class="auth-name">Observer</text>
    <text x="622" y="194" class="auth-label">Service identity</text>
    <text x="622" y="216" class="auth-label">+ external object of the request</text>
    <path d="M737 272 V374" class="auth-edge"/>
  </g>

  <g id="auth-resolve-execution-client">
    <rect x="52" y="374" width="516" height="166" rx="6" class="auth-facility"/>
    <text x="68" y="402" class="auth-name">1 · Resolve execution / client identity</text>
    <text x="68" y="430" class="auth-label">Identity → project + node</text>
    <text x="68" y="453" class="auth-label">Execution identity → node of its claim</text>
    <text x="68" y="477" class="auth-label">For an execution operation, read its claim state</text>
    <text x="68" y="499" class="auth-label">from the Scheduler Service.</text>
    <text x="68" y="527" class="auth-label">A live claim proves liveness; it authorizes no operation.</text>
    <path d="M310 540 V560 H450 V582" class="auth-edge"/>
    <path d="M128 540 V756" class="auth-edge"/>
    <text x="142" y="566" class="auth-label">Another node</text>
    <text x="142" y="587" class="auth-label">requested</text>
  </g>
  <g id="auth-resolve-service">
    <rect x="594" y="374" width="254" height="166" rx="6" class="auth-facility"/>
    <text x="610" y="402" class="auth-name">1 · Resolve service identity</text>
    <text x="610" y="434" class="auth-label">External object</text>
    <text x="610" y="459" class="auth-label">→ repository binding</text>
    <text x="610" y="484" class="auth-label">→ project + node</text>
    <path d="M721 540 V560 H450" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
  </g>

  <g id="auth-check-binding">
    <rect x="234" y="582" width="432" height="118" rx="6" class="auth-facility"/>
    <text x="250" y="611" class="auth-name">2 · Check the current project binding</text>
    <text x="250" y="639" class="auth-label">Does the binding permit the requested operation?</text>
    <text x="250" y="663" class="auth-label">Service identity: read of an external object only.</text>
    <text x="250" y="687" class="auth-label">Validate the binding and its credential reference.</text>
    <path d="M234 642 H164 V756" class="auth-edge"/>
    <text x="200" y="630" text-anchor="middle" class="auth-label">Refused</text>
    <path d="M450 700 V756" class="auth-edge"/>
    <text x="466" y="734" class="auth-label">Permitted</text>
  </g>
  <g id="auth-refusal">
    <rect x="52" y="756" width="220" height="74" rx="6" class="auth-node"/>
    <text x="68" y="785" class="auth-name">Refuse operation</text>
    <text x="68" y="813" class="auth-label">Never consult custody.</text>
  </g>
  <g id="auth-consult-custody">
    <rect x="322" y="756" width="288" height="74" rx="6" class="auth-custody"/>
    <text x="338" y="785" class="auth-name">3 · Consult custody</text>
    <text x="338" y="813" class="auth-label">Secret material behind the facility</text>
    <path d="M450 830 V874" class="auth-edge"/>
  </g>
  <g id="auth-perform-operation">
    <rect x="322" y="874" width="288" height="76" rx="6" class="auth-facility"/>
    <text x="338" y="903" class="auth-name">4 · Perform operation</text>
    <text x="338" y="931" class="auth-label">Authenticated against the remote</text>
    <path d="M610 912 H630 V1038 H650" class="auth-operation"/>
    <path d="M650 1060 H450 V950" class="auth-return"/>
    <text x="466" y="994" class="auth-label">Result</text>
  </g>

  <text x="52" y="880" class="auth-label">An execution records the</text>
  <text x="52" y="902" class="auth-label">binding revision it resolves.</text>
  <text x="52" y="936" class="auth-label">Current authorization decides.</text>
  <rect x="650" y="1000" width="218" height="78" rx="6" fill="#ededee" stroke="#7a8399" stroke-width="1.2"/>
  <text x="666" y="1025" class="auth-tag">EXTERNAL SYSTEM</text>
  <text x="666" y="1051" class="auth-name">Remote</text>
  <text x="666" y="1071" class="auth-label">Credential authority</text>
  <text x="32" y="1018" class="auth-name">No credential leaves the daemon.</text>
  <text x="32" y="1046" class="auth-label">An execution and an external harness hold none.</text>
  <text x="32" y="1109" class="auth-label">Execution operation record → execution identity · Observation record → service identity</text>
  <text x="32" y="1134" class="auth-label">Credential record → configuring actor + upstream principal; these identities stay separate.</text>

  <line x1="32" y1="1164" x2="868" y2="1164" class="auth-rule"/>
  <text x="32" y="1201" class="auth-title">Delivery-source verification</text>
  <text x="32" y="1228" class="auth-label">The Project Service verifies a delivery as its own operation.</text>
  <g id="auth-delivery-verification">
    <rect x="32" y="1250" width="836" height="272" rx="10" fill="#efeff1" stroke="#c9cdd5" stroke-width="1.2"/>
    <text x="52" y="1280" class="auth-tag">INSIDE THE DAEMON · PROJECT SERVICE</text>
    <rect x="52" y="1310" width="216" height="86" rx="6" class="auth-node"/>
    <text x="68" y="1338" class="auth-name">Source binding</text>
    <text x="68" y="1364" class="auth-label">Of the delivery's project</text>
    <text x="68" y="1386" class="auth-label">Binds an accepted source</text>
    <path d="M268 1353 H346" class="auth-edge"/>
    <text x="307" y="1340" text-anchor="middle" class="auth-tag">consult</text>
    <rect x="346" y="1310" width="218" height="86" rx="6" class="auth-custody"/>
    <text x="362" y="1338" class="auth-name">Custody</text>
    <text x="362" y="1364" class="auth-label">Holds the verification</text>
    <text x="362" y="1386" class="auth-label">secret behind the facility</text>
    <path d="M564 1353 H644" class="auth-edge"/>
    <text x="604" y="1340" text-anchor="middle" class="auth-tag">use</text>
    <rect x="644" y="1310" width="204" height="86" rx="6" class="auth-facility"/>
    <text x="660" y="1338" class="auth-name">Verify delivery</text>
    <text x="660" y="1364" class="auth-label">Against the project's</text>
    <text x="660" y="1386" class="auth-label">source binding</text>
    <text x="52" y="1435" class="auth-label">No requester identity: this operation acts on nothing external.</text>
    <line x1="52" y1="1454" x2="848" y2="1454" class="auth-rule"/>
    <text x="52" y="1487" class="auth-name">Delivery verification record → source binding</text>
  </g>
  <text x="32" y="1560" class="auth-label">Source: project-service.md · Authorization and credential custody; Configuration lifecycle and consistency</text>
</svg>
