      <text x="1064" y="128" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">credential authority</text>

      <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="658" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">No credential leaves the daemon. A run holds none, and an external harness holds none.</text>
      <text x="40" y="678" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">A liveness token proves that a run is live, and it authorizes no operation.</text>

      <line x1="40" y1="698" x2="1240" y2="698" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="726" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
