      <text x="168" y="726" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">API or CLI</text>
      <line x1="304" y1="722" x2="328" y2="722" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="336" y="726" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Call</text>
      <line x1="424" y1="722" x2="448" y2="722" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="456" y="726" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Return</text>
      <line x1="560" y1="722" x2="584" y2="722" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="592" y="726" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Authenticated operation</text>
      <rect x="840" y="714" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="860" y="726" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Holds control</text>
      <line x1="1016" y1="714" x2="1016" y2="730" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="1032" y="726" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace">Lifeline</text>
