      <text x="516" y="232" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROJECT/LEVEL</text>
      <text x="516" y="268" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHECK BINDING</text>

