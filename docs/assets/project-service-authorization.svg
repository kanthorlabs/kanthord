      <text x="92" y="84" fill="rgba(122,131,153,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUESTER</text>
      <text x="152" y="110" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Requester</text>
      <text x="152" y="128" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">run or harness</text>

      <rect x="344" y="64" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="344" y="64" width="224" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="356" y="72" width="72" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="392" y="84" fill="rgba(235,108,54,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FACILITY</text>
      <text x="456" y="110" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Protected facility</text>
      <text x="456" y="128" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">resolves and checks</text>

      <rect x="648" y="64" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="64" width="224" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="660" y="72" width="68" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="694" y="84" fill="rgba(79,93,117,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CUSTODY</text>
      <text x="760" y="110" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Custody</text>
      <text x="760" y="128" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">secret material</text>

