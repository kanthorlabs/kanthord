<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="1000" viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="project-service-bindings-title project-service-bindings-desc">
      <title id="project-service-bindings-title">Project Service binding model</title>
      <desc id="project-service-bindings-desc">A project holds many bindings, and every binding allocates one resource that exists independently of the project. A binding references another binding by identity and never by revision. Repository, worker and provider account are kinds of binding. A worker binding holds one agent entry for each agent of its worker, and each entry names one provider account binding together with a model identifier. A repository binding holds one credential reference for each capability that it requires, and a provider account binding holds one credential reference; each reference names a credential store record that serves more than one project.</desc>
