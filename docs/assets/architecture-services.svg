<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="600" viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kanthord-services-title kanthord-services-desc">
      <title id="kanthord-services-title">kanthord service diagram</title>
      <desc id="kanthord-services-desc">Five services inside the kanthord daemon: clients reach the Project, Mission and Tracking Services; the Scheduler Service reads the graph and outcomes from the Mission Service; the Worker Service takes an available level from the Scheduler, reads resources and credentials from the Project Service, writes evidence to the Mission Service, and reaches a git platform and a large language model provider; every service writes telemetry to the Tracking Service.</desc>
