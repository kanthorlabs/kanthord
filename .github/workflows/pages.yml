name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test documentation navigation
        run: node --test scripts/docs/navigation.test.mjs
      - name: Test publication boundary
        run: python3 scripts/docs/build.test.py
      - name: Build public documentation only
        run: scripts/docs/build.sh "$RUNNER_TEMP/kanthord-public-docs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/kanthord-public-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
